<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020C1B"/>
      <stop offset="50%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#09223D"/>
    </linearGradient>
    <linearGradient id="routeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad2)"/>
  
  <!-- Subtle Route Map Grid -->
  <g stroke="rgba(56, 189, 248, 0.08)" stroke-width="1.5">
    <circle cx="600" cy="400" r="150" fill="none"/>
    <circle cx="600" cy="400" r="300" fill="none"/>
    <circle cx="600" cy="400" r="450" fill="none"/>
    <line x1="150" y1="400" x2="1050" y2="400"/>
    <line x1="600" y1="100" x2="600" y2="700"/>
  </g>

  <!-- Navigation Path Line -->
  <path d="M 220 520 C 350 350, 480 580, 680 320 S 920 400, 980 260" fill="none" stroke="url(#routeGrad)" stroke-width="6" stroke-dasharray="10 6"/>

  <!-- Waypoints -->
  <g transform="translate(220, 520)">
    <circle cx="0" cy="0" r="16" fill="#0A192F" stroke="#10B981" stroke-width="4" filter="url(#glow2)"/>
    <circle cx="0" cy="0" r="6" fill="#10B981"/>
    <rect x="-80" y="24" width="160" height="42" rx="8" fill="rgba(10, 25, 47, 0.9)" stroke="rgba(16, 185, 129, 0.5)" stroke-width="1"/>
    <text x="0" y="48" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Planta Terminal Callao</text>
  </g>

  <g transform="translate(680, 320)">
    <circle cx="0" cy="0" r="18" fill="#0A192F" stroke="#38BDF8" stroke-width="4" filter="url(#glow2)"/>
    <circle cx="0" cy="0" r="8" fill="#38BDF8"/>
    <rect x="-100" y="-60" width="200" height="48" rx="8" fill="rgba(10, 25, 47, 0.9)" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1"/>
    <text x="0" y="-38" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Cisterna T-402 en Tránsito</text>
    <text x="0" y="-20" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Vel: 52 km/h • ETA: 35 min</text>
  </g>

  <g transform="translate(980, 260)">
    <circle cx="0" cy="0" r="16" fill="#0A192F" stroke="#F59E0B" stroke-width="4" filter="url(#glow2)"/>
    <circle cx="0" cy="0" r="6" fill="#F59E0B"/>
    <rect x="-90" y="24" width="180" height="42" rx="8" fill="rgba(10, 25, 47, 0.9)" stroke="rgba(245, 158, 11, 0.5)" stroke-width="1"/>
    <text x="0" y="48" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Estación Servicentro Sol</text>
  </g>

  <!-- Tanker Truck Graphic Silhouette at center -->
  <g transform="translate(480, 440)">
    <!-- Truck Cab and Tanker Body -->
    <rect x="0" y="0" width="260" height="90" rx="14" fill="#0F2B48" stroke="#38BDF8" stroke-width="2"/>
    <rect x="200" y="20" width="50" height="70" rx="8" fill="#0284C7"/>
    <rect x="215" y="30" width="30" height="25" rx="4" fill="#93C5FD"/>
    <circle cx="45" cy="100" r="18" fill="#1E293B" stroke="#64748B" stroke-width="4"/>
    <circle cx="100" cy="100" r="18" fill="#1E293B" stroke="#64748B" stroke-width="4"/>
    <circle cx="215" cy="100" r="18" fill="#1E293B" stroke="#64748B" stroke-width="4"/>
    <text x="100" y="52" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="800">FUELGUARD LOGISTICS</text>
    <text x="100" y="72" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Capacidad: 5,000 GL DIESEL</text>
  </g>

  <!-- Top Status Bar -->
  <g transform="translate(80, 50)">
    <rect width="1040" height="70" rx="14" fill="rgba(15, 43, 72, 0.8)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <text x="30" y="42" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="800">DISPATCH CONTROL • RUTA Y GEOCERCAS EN VIVO</text>
    <text x="820" y="42" fill="#10B981" font-family="system-ui, sans-serif" font-size="15" font-weight="700">100% TRAZABILIDAD AUDITADA</text>
  </g>

  <!-- Bottom Analytics Widget -->
  <g transform="translate(80, 650)">
    <rect width="1040" height="90" rx="14" fill="rgba(2, 12, 27, 0.9)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
    <text x="50" y="40" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">ASIGNACIÓN INTELIGENTE</text>
    <text x="50" y="68" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="22" font-weight="800">0% Desajustes de Capacidad</text>

    <text x="400" y="40" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">REDUCCIÓN TIEMPO DE RESPUESTA</text>
    <text x="400" y="68" fill="#10B981" font-family="system-ui, sans-serif" font-size="22" font-weight="800">-40% En Ciclo de Despacho</text>

    <text x="780" y="40" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">AUTOMATIZACIÓN DE PEDIDOS</text>
    <text x="780" y="68" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="22" font-weight="800">&gt; 80% Pedidos Vía Telemetría</text>
  </g>
</svg>
