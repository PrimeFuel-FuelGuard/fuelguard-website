<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="dashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020C1B"/>
      <stop offset="100%" stop-color="#0F2B48"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="700" fill="url(#dashBg)"/>

  <!-- Window Frame -->
  <rect x="40" y="30" width="1120" height="640" rx="16" fill="rgba(10, 25, 47, 0.95)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2"/>
  
  <!-- Window Header -->
  <rect x="40" y="30" width="1120" height="50" rx="16" fill="#0A192F"/>
  <circle cx="70" cy="55" r="7" fill="#EF4444"/>
  <circle cx="95" cy="55" r="7" fill="#F59E0B"/>
  <circle cx="120" cy="55" r="7" fill="#10B981"/>
  <text x="600" y="60" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">FuelGuard Cloud Platform • https://app.fuelguard.io/dashboard</text>

  <!-- Left Sidebar Navigation -->
  <rect x="40" y="80" width="220" height="590" fill="#06182E"/>
  <text x="70" y="125" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="800">FUELGUARD</text>
  
  <!-- Sidebar Menu Items -->
  <rect x="55" y="160" width="190" height="42" rx="8" fill="rgba(2, 132, 199, 0.3)" stroke="#0284C7" stroke-width="1"/>
  <text x="80" y="186" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">📊 Panel Telemetría</text>

  <rect x="55" y="215" width="190" height="42" rx="8" fill="transparent"/>
  <text x="80" y="241" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14">🚛 Flota de Cisternas</text>

  <rect x="55" y="270" width="190" height="42" rx="8" fill="transparent"/>
  <text x="80" y="296" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14">⛽ Tanques Estacionarios</text>

  <rect x="55" y="325" width="190" height="42" rx="8" fill="transparent"/>
  <text x="80" y="351" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14">📦 Pedidos y Despacho</text>

  <rect x="55" y="380" width="190" height="42" rx="8" fill="transparent"/>
  <text x="80" y="406" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14">🛡️ Reportes OSINERGMIN</text>

  <!-- Main Content Area -->
  <!-- Top Stat Cards -->
  <g transform="translate(290, 110)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="260" height="110" rx="12" fill="rgba(15, 43, 72, 0.6)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
    <text x="25" y="35" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">NIVEL TOTAL EN RED</text>
    <text x="25" y="75" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="32" font-weight="800">425,800 GL</text>
    <text x="25" y="95" fill="#10B981" font-family="system-ui, sans-serif" font-size="12" font-weight="600">+12% vs día anterior</text>

    <!-- Card 2 -->
    <rect x="285" y="0" width="260" height="110" rx="12" fill="rgba(15, 43, 72, 0.6)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
    <text x="310" y="35" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">CISTERNAS EN RUTA</text>
    <text x="310" y="75" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="32" font-weight="800">18 / 20 Activas</text>
    <text x="310" y="95" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Geocercas verificadas</text>

    <!-- Card 3 -->
    <rect x="570" y="0" width="260" height="110" rx="12" fill="rgba(15, 43, 72, 0.6)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
    <text x="595" y="35" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">ALERTAS DE REORDEN</text>
    <text x="595" y="75" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="32" font-weight="800">3 Críticas</text>
    <text x="595" y="95" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Pedidos autogenerados</text>
  </g>

  <!-- Big Telemetry Chart Box -->
  <g transform="translate(290, 245)">
    <rect x="0" y="0" width="830" height="390" rx="14" fill="rgba(2, 12, 27, 0.8)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
    <text x="30" y="40" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Monitoreo de Consumo y Descarga por Estación (m³ / hora)</text>
    <text x="680" y="40" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">En vivo • 1 seg</text>

    <!-- Bar Chart Simulation -->
    <rect x="60" y="240" width="40" height="120" rx="6" fill="url(#barGrad)"/>
    <rect x="140" y="190" width="40" height="170" rx="6" fill="url(#barGrad)"/>
    <rect x="220" y="140" width="40" height="220" rx="6" fill="url(#barGrad)"/>
    <rect x="300" y="100" width="40" height="260" rx="6" fill="url(#barGrad)"/>
    <rect x="380" y="160" width="40" height="200" rx="6" fill="url(#barGrad)"/>
    <rect x="460" y="210" width="40" height="150" rx="6" fill="url(#barGrad)"/>
    <rect x="540" y="120" width="40" height="240" rx="6" fill="url(#barGrad)"/>
    <rect x="620" y="80" width="40" height="280" rx="6" fill="url(#barGrad)"/>
    <rect x="700" y="150" width="40" height="210" rx="6" fill="url(#barGrad)"/>

    <!-- Labels -->
    <text x="80" y="380" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">08:00</text>
    <text x="160" y="380" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">10:00</text>
    <text x="240" y="380" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">12:00</text>
    <text x="320" y="380" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">14:00</text>
    <text x="400" y="380" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">16:00</text>
    <text x="480" y="380" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">18:00</text>
    <text x="560" y="380" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">20:00</text>
    <text x="640" y="380" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">22:00</text>
    <text x="720" y="380" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">00:00</text>
  </g>
</svg>
