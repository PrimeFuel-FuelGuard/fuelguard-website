      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#0F2B48"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" rx="24" fill="url(#cardGrad1)"/>
  <circle cx="300" cy="240" r="140" fill="rgba(2, 132, 199, 0.15)" stroke="#0284C7" stroke-width="2"/>
  
  <!-- Tanker Truck Icon -->
