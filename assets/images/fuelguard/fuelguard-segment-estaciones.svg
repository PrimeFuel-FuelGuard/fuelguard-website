<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#0F2B48"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" rx="24" fill="url(#cardGrad2)"/>
  <circle cx="300" cy="240" r="140" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="2"/>

  <!-- Stationary Tank Icon with Sensor Wave -->
  <g transform="translate(180, 140)">
    <rect x="30" y="50" width="180" height="150" rx="24" fill="#1E293B" stroke="#10B981" stroke-width="3"/>
    <rect x="40" y="100" width="160" height="90" rx="14" fill="#0284C7"/>
    <circle cx="120" cy="30" r="14" fill="#F59E0B"/>
    <path d="M 100 50 Q 120 70 140 50" stroke="#38BDF8" stroke-width="3" fill="none"/>
    <text x="120" y="150" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="24" font-weight="800" text-anchor="middle">85%</text>
  </g>

  <!-- Telemetry Badge -->
  <rect x="100" y="420" width="400" height="120" rx="16" fill="rgba(2, 12, 27, 0.85)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5"/>
  <text x="300" y="460" fill="#10B981" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">ESTACIONES Y CONSUMIDORES</text>
  <text x="300" y="495" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="800" text-anchor="middle">Monitoreo IoT en Tanques</text>
  <text x="300" y="525" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Telemetría ultrasónica • Pedidos automáticos</text>
</svg>
